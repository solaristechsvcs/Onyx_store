<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onyx Staff Panel</title><style>body{font:16px system-ui;background:#14121b;color:#f5f1ff;margin:0}main{max-width:950px;margin:auto;padding:30px}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #40334e;text-align:left}button,select{padding:9px;border-radius:7px;background:#4b295e;color:white;border:1px solid #76538a}a{color:#d8baff}.error{color:#ffb6b6}</style></head><body><main><h1>Onyx Store · Staff Panel</h1><p><a href="/">Store</a> · <a href="/api/accounts/discord/login">Discord login</a></p><p id="status">Loading...</p><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead><tbody id="users"></tbody></table></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const me=await(await fetch('/api/accounts/me')).json();if(!me.user||!['staff','admin','owner'].includes(me.user.role)){document.getElementById('status').textContent='Staff login required';return;}const r=await fetch('/api/staff/users');if(!r.ok){document.getElementById('status').textContent='Unable to load users';return;}const users=await r.json();document.getElementById('status').textContent='Signed in as '+me.user.display_name+' ('+me.user.role+')';document.getElementById('users').innerHTML=users.map(u=>'<tr><td>'+esc(u.id)+'</td><td>'+esc(u.display_name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.role)+'</td><td>'+(['admin','owner'].includes(me.user.role)&&u.role!=='owner'&&String(u.id)!==String(me.user.id)?'<select data-id="'+esc(u.id)+'"><option value="">Change role...</option>'+['customer','staff',...(me.user.role==='owner'?['admin']:[])].map(x=>'<option value="'+x+'">'+x+'</option>').join('')+'</select>':'Protected')+'</td></tr>').join('');}
document.getElementById('users').addEventListener('change',async e=>{if(e.target.tagName!=='SELECT'||!e.target.value)return;const id=e.target.dataset.id;const r=await fetch('/api/staff/users/'+encodeURIComponent(id)+'/role',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:e.target.value})});if(!r.ok)alert((await r.json()).error||'Update failed');await load();});load().catch(()=>document.getElementById('status').textContent='Unable to load staff panel');
</script></body></html>
